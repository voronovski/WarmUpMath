<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warm Up Math</title>
    <meta name="description" content="Practice addition, subtraction, multiplication and division with timed quizzes and marathons.">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Warm Up Math">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Start Screen -------------------------------------------------------------->
<div id="start-screen">
    <h1>Warm Up Math</h1>

    <div id="session-tab" class="tab-panel">
        <div class="field">
            <label>Rubric</label>
            <input type="hidden" id="rubric" value="addition">
            <div class="btn-group" id="rubric-group">
                <button type="button" class="option-btn" data-value="addition">Addition</button>
                <button type="button" class="option-btn" data-value="subtraction">Subtraction</button>
                <button type="button" class="option-btn" data-value="multiplication">Multiplication</button>
                <button type="button" class="option-btn" data-value="division">Division</button>
            </div>
        </div>

        <div class="field">
            <label>Difficulty</label>
            <input type="hidden" id="difficulty" value="easy">
            <div class="btn-group" id="difficulty-group">
                <button type="button" class="option-btn" data-value="easy">Easy</button>
                <button type="button" class="option-btn" data-value="medium">Medium</button>
                <button type="button" class="option-btn" data-value="hard">Hard</button>
            </div>
        </div>

        <div class="field-row">
            <div class="field">
                <label>Number of Questions</label>
                <input type="number" id="num-questions" value="10" min="1" max="50">
            </div>
            <div class="field">
                <label>Time (sec.)</label>
                <input type="number" id="time-limit" value="15" min="5" max="120">
            </div>
        </div>

        <div id="start-actions">
            <button id="start-btn" class="btn-primary">Start</button>
        </div>

        <div id="history-chart-section">
            <h3>Error Rate History</h3>
            <canvas id="history-chart" width="500" height="250"></canvas>
        </div>
    </div>

    <div id="marathon-tab" class="tab-panel" style="display:none;">
        <div class="field">
            <label>Difficulty</label>
            <input type="hidden" id="marathon-difficulty" value="easy">
            <div class="btn-group" id="marathon-difficulty-group">
                <button type="button" class="option-btn" data-value="easy">Easy</button>
                <button type="button" class="option-btn" data-value="medium">Medium</button>
                <button type="button" class="option-btn" data-value="hard">Hard</button>
            </div>
        </div>

        <div id="marathon-actions">
            <button id="marathon-btn" class="btn-primary">Start</button>
        </div>

        <div id="marathon-chart-section">
            <h3>Marathon Grade History</h3>
            <canvas id="marathon-chart" width="500" height="320"></canvas>
        </div>
    </div>

    <div id="generate-tab" class="tab-panel" style="display:none;">
        <div id="gen-sets"></div>

        <div id="gen-actions">
            <button type="button" id="gen-add-set-btn" class="btn-secondary" disabled>+ Add Set</button>
            <button type="button" id="gen-generate-btn" class="btn-primary">Generate</button>
        </div>

        <div id="gen-error" style="display:none;"></div>

        <div id="gen-worksheet" style="display:none;">
            <div id="gen-questions"></div>
            <div id="gen-check-actions">
                <button type="button" id="gen-check-btn" class="btn-primary" disabled>Check</button>
            </div>
            <div id="gen-score" style="display:none;"></div>
        </div>
    </div>

    <div id="attempts-history-section">
        <h3>Recent Attempts</h3>
        <div id="attempts-table-wrap">
            <table id="attempts-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Test</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="attempts-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Quiz Screen --------------------------------------------------------------->
<div id="quiz-screen" style="display:none;">
    <div id="quiz-header">
        <h2 id="rubric-name"></h2>
        <div>
            Question <span id="question-number">1</span>
        </div>
        <div id="progress-bar">
            <div id="progress-bar-fill"></div>
        </div>
    </div>

    <div id="problem">
        <h1 id="problem-statement"></h1>
        <input type="number" id="answer" inputmode="numeric" enterkeyhint="next" autocomplete="off">
        <div>
            <button type="button" id="next-btn" class="btn-primary">Next</button>
        </div>
    </div>

    <div id="control-bar" style="display: none">
        <button id="back-btn" class="btn-secondary">Back</button>
        <button id="quit-btn" class="btn-secondary">Quit</button>
    </div>
</div>

<!-- Results Screen ------------------------------------------------------------>
<div id="results-screen" style="display:none; position: relative;">

    <!-- Fireworks Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <h1>Results</h1>

    <div id="score-summary">
        <h1 id="big-score"></h1>
        <p id="score-fraction"></p>
        <p>Total Time: <span id="time-elapsed"></span> seconds</p>
    </div>

    <h3>Detailed Statistics</h3>
    <div>
      <label><input type="checkbox" id="only-errors-chk"
          style="width: 30px"> Show errors only</label>
    </div>
    <div id="question-stats"></div>

    <div id="results-actions">
        <button id="home-btn" class="btn-secondary">Home</button>
        <button id="restart-btn" class="btn-primary">Restart</button>
    </div>
</div>

<!-- Bottom dock navigation ----------------------------------------------------->
<nav class="dock-nav" id="mode-tabs" aria-label="Mode">
    <button type="button" class="tab-btn active" data-tab="session">
        <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false">
                <circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="1.7"></circle>
                <path d="M12 9v4l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M10 2h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            </svg>
        </span>
        <span class="tab-label">Session</span>
    </button>
    <button type="button" class="tab-btn" data-tab="marathon">
        <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></polygon>
            </svg>
        </span>
        <span class="tab-label">Marathon</span>
    </button>
    <button type="button" class="tab-btn" data-tab="generate">
        <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false">
                <path d="M12 20h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </span>
        <span class="tab-label">Generate</span>
    </button>
</nav>

<script src="script.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js").catch((err) => {
                console.error("Service worker registration failed:", err);
            });
        });
    }
</script>

</body>
</html>
